<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SEA  Student Entrepreneurship Association</title>
  <desc id="desc">Animated banner: Educate, Incubate, Accelerate</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#1A0505"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CC0000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CC0000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- sweeping accent bar -->
    <rect x="-400" y="0" width="280" height="360" fill="url(#redGlow)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1400 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- grid lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
      <line x1="0" y1="90" x2="1200" y2="90"/>
      <line x1="0" y1="270" x2="1200" y2="270"/>
      <line x1="200" y1="0" x2="200" y2="360"/>
      <line x1="1000" y1="0" x2="1000" y2="360"/>
    </g>

    <!-- left accent block -->
    <rect x="0" y="0" width="14" height="360" fill="#CC0000">
      <animate attributeName="height" values="360;280;360" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;40;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- brand mark -->
    <g transform="translate(72, 78)">
      <rect width="72" height="72" fill="#CC0000" rx="4">
        <animate attributeName="opacity" values="1;0.75;1" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="36" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">S</text>
    </g>

    <text x="168" y="128" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="6">SEA</text>
    <text x="168" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#CCCCCC" letter-spacing="3">STUDENT ENTREPRENEURSHIP ASSOCIATION</text>

    <!-- arc pills -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
      <g transform="translate(168, 220)">
        <rect width="150" height="44" rx="4" fill="#CC0000"/>
        <text x="75" y="29" text-anchor="middle" fill="#FFFFFF">EDUCATE</text>
        <animateTransform attributeName="transform" type="translate" values="168 220;168 214;168 220" dur="2s" repeatCount="indefinite"/>
      </g>
      <text x="338" y="249" fill="#666666" font-size="28">’</text>
      <g transform="translate(372, 220)">
        <rect width="170" height="44" rx="4" fill="#1A1A1A" stroke="#CC0000" stroke-width="2"/>
        <text x="85" y="29" text-anchor="middle" fill="#FFFFFF">INCUBATE</text>
        <animateTransform attributeName="transform" type="translate" values="372 220;372 214;372 220" dur="2s" begin="0.35s" repeatCount="indefinite"/>
      </g>
      <text x="562" y="249" fill="#666666" font-size="28">’</text>
      <g transform="translate(596, 220)">
        <rect width="180" height="44" rx="4" fill="#FFFFFF"/>
        <text x="90" y="29" text-anchor="middle" fill="#0A0A0A">ACCELERATE</text>
        <animateTransform attributeName="transform" type="translate" values="596 220;596 214;596 220" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- right side pulse -->
    <circle cx="1040" cy="180" r="56" fill="none" stroke="#CC0000" stroke-width="3" opacity="0.5">
      <animate attributeName="r" values="40;78;40" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="180" r="28" fill="#CC0000">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1040" y="188" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">B-LABS</text>

    <text x="72" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#888888" letter-spacing="2">UNIVERSITY OF BIRMINGHAM  ·  UoB DUBAI</text>
  </g>
</svg>
